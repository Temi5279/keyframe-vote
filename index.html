  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding-bottom: 80px;
    }

    header {
      background: #12081f;
      padding: 18px 16px;
      text-align: center;
      border-bottom: 1px solid #2d1b4e;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.4rem;
      background: linear-gradient(90deg, #c084fc, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-top: 4px;
    }

    .category {
      padding: 24px 16px 10px;
      border-bottom: 1px solid #1f1f2e;
    }

    .category-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e9d5ff;
    }

    .votes-left {
      font-size: 0.8rem;
      color: #c084fc;
      margin-bottom: 14px;
    }

    .nominees {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .card {
      background: #1a1325;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2d1b4e;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card.voted {
      border-color: #a855f7;
      background: #2e1065;
    }

    .placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #4c1d95, #7e22ce);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: rgba(255,255,255,0.3);
    }

    .name {
      padding: 10px 8px;
      font-size: 0.82rem;
      text-align: center;
      font-weight: 500;
    }

    .share-box {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1325;
      padding: 16px;
      border-top: 1px solid #2d1b4e;
      text-align: center;
      z-index: 200;
    }

    .share-box button {
      background: #a855f7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      max-width: 320px;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #a855f7;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      z-index: 300;
    }
  </style>

<body>

  <header>
    <h1>KEYFRAME AWARDS</h1>
    <div class="subtitle">Vote for your favourites • 10 votes per category daily</div>
  </header>

  <div id="app"></div>

  <div class="share-box" id="shareBox">
    <button id="shareBtn">Share my vote</button>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6PoUXyNIyWUfLcaoGQnUONz_21Tc_Gwg",
      authDomain: "keyframe-awards.firebaseapp.com",
      databaseURL: "https://keyframe-awards-default-rtdb.firebaseio.com",
      projectId: "keyframe-awards",
      storageBucket: "keyframe-awards.firebasestorage.app",
      messagingSenderId: "882083630221",
      appId: "1:882083630221:web:629df7642fdf822018a6c4",
      measurementId: "G-Z8HX6L8WEG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const categories = [
      {
        id: "overall-creator",
        title: "Overall Creator of the Year",
        nominees: ["Kai Cenat", "IShowSpeed", "MrBeast", "xQc", "CaseOh", "Ibai"]
      },
      {
        id: "rising-star",
        title: "Rising Star of the Year",
        nominees: ["Lamine Yamal", "ILLIT", "Jynxzi", "Ironmouse", "KATSEYE", "Caedrel"]
      },
      {
        id: "viral-phenomenon",
        title: "Viral Phenomenon of the Year",
        nominees: ["6-7 Meme", "Saxophone sound", "Labubu", "100 Men vs 1 Gorilla"]
      },
      {
        id: "meme-lord",
        title: "Meme Lord/Lady of the Year",
        nominees: ["IShowSpeed", "Kai Cenat", "CaseOh", "xQc"]
      },
      {
        id: "best-kpop",
        title: "Best K-pop Group",
        nominees: ["BTS", "BLACKPINK", "Stray Kids", "SEVENTEEN", "aespa", "ILLIT"]
      },
      {
        id: "best-artist",
        title: "Best Artist",
        nominees: ["Taylor Swift", "Lisa", "Sabrina Carpenter", "Bruno Mars", "Adela", "Zara Larsson"]
      },
      {
        id: "music-edit",
        title: "Best Music Edit / MV Recreation",
        nominees: ["AnimeVibe", "StarLab", "Trash", "Vexed", "Kuro", "Zero"]
      },
      {
        id: "hyped-mv",
        title: "Most Hyped Music Video Edit",
        nominees: ["Cyberpunk Edgerunners AMV edits", "Travis Scott UTOPIA visual remixes", "TikTok cinematic audio synchs"]
      },
      {
        id: "meme-of-year",
        title: "Meme of the Year",
        nominees: ["6-7", "Labubu", "100 Men vs 1 Gorilla", "Jet2 Holiday"]
      },
      {
        id: "meme-edit",
        title: "Best Meme Edit / Sound",
        nominees: ["McFly", "Brainrot phonk remixes", "Sound effect overlays"]
      },
      {
        id: "roast-meme",
        title: "Best Roast Meme",
        nominees: ["Speed roasts", "Kai Cenat moments", "xQc moments", "CaseOh moments"]
      },
      {
        id: "movie-edit",
        title: "Best Movie Edit / Recap",
        nominees: ["ManOfRecaps", "ScreenCrush", "FilmJunkee", "Heavy Spoilers", "Valyan", "Reel Insight"]
      },
      {
        id: "tv-edit",
        title: "Best TV Show Edit",
        nominees: ["Succession character edits", "The Boys Homelander edits", "Arcane visual cuts", "House of the Dragon fan tributes"]
      },
      {
        id: "series-theory",
        title: "Best Series Theory / Breakdown",
        nominees: ["Alt Shift X", "Inside A Mind", "New Rockstars", "The Canadian Lad"]
      },
      {
        id: "football-edit",
        title: "Best Football Edit",
        nominees: ["433 community editors", "Commps", "Zvck", "CompsHD", "RMCF edits", "NXGN creators"]
      },
      {
        id: "goal-montage",
        title: "Most Hyped Goal Montage",
        nominees: ["Champions League dramatic comebacks", "Puskas Award finalists compilation", "World Cup iconic strikes"]
      },
      {
        id: "match-highlight",
        title: "Best Match Highlight Creator",
        nominees: ["Analyst reels", "Dexerto sports clips", "CBS Sports Golazo community", "Fabrizio Romano reaction cuts"]
      },
      {
        id: "gaming-edit",
        title: "Best Gaming Edit / Montage",
        nominees: ["Anomaly", "Mictia", "TheRussianBadger", "Jynxzi clips"]
      },
      {
        id: "best-streamer",
        title: "Best Streamer / Creator",
        nominees: ["Kai Cenat", "xQc", "CaseOh", "Jynxzi", "Ironmouse", "IShowSpeed"]
      },
      {
        id: "chaotic-moment",
        title: "Most Chaotic Stream Moment",
        nominees: ["CaseOh food chat meltdowns", "Kai Cenat celebrity lock-ins", "Jynxzi rage moment", "Twitch streamer setup destruction clips"]
      }
    ];

    function getToday() {
      return new Date().toISOString().split('T')[0];
    }

    function getVotesLeft(categoryId) {
      const key = `votes_\( {categoryId}_ \){getToday()}`;
      const used = parseInt(localStorage.getItem(key) || "0");
      return Math.max(0, 10 - used);
    }

    function useVote(categoryId) {
      const key = `votes_\( {categoryId}_ \){getToday()}`;
      const used = parseInt(localStorage.getItem(key) || "0");
      localStorage.setItem(key, used + 1);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 2200);
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";

      categories.forEach(cat => {
        const left = getVotesLeft(cat.id);

        const section = document.createElement("div");
        section.className = "category";
        section.innerHTML = `
          <div class="category-title">${cat.title}</div>
          <div class="votes-left">\( {left} vote \){left !== 1 ? 's' : ''} left today</div>
          <div class="nominees" id="nominees-${cat.id}"></div>
        `;

        const nomineesDiv = section.querySelector(`#nominees-${cat.id}`);

        cat.nominees.forEach(name => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="placeholder">★</div>
            <div class="name">${name}</div>
          `;

          card.onclick = () => handleVote(cat, name, card);
          nomineesDiv.appendChild(card);
        });

        app.appendChild(section);
      });
    }

    async function handleVote(category, nominee, card) {
      const left = getVotesLeft(category.id);
      if (left <= 0) {
        showToast("No votes left in this category today");
        return;
      }

      try {
        await addDoc(collection(db, "votes"), {
          category: category.title,
          categoryId: category.id,
          nominee: nominee,
          createdAt: serverTimestamp(),
          userId: auth.currentUser ? auth.currentUser.uid : "anonymous"
        });
      } catch (err) {
        console.log("Firestore error:", err);
      }

      useVote(category.id);
      card.classList.add("voted");
      showToast(`Voted for ${nominee}`);

      const votesLeftEl = card.closest(".category").querySelector(".votes-left");
      const newLeft = getVotesLeft(category.id);
      votesLeftEl.textContent = `\( {newLeft} vote \){newLeft !== 1 ? 's' : ''} left today`;

      const shareBox = document.getElementById("shareBox");
      const shareBtn = document.getElementById("shareBtn");
      shareBox.style.display = "block";
      shareBtn.onclick = () => {
        const text = `I just voted for ${nominee} in ${category.title} at the Keyframe Awards!\n\nCast your vote too: https://vote.keyframe-awards.com`;
        if (navigator.share) {
          navigator.share({ text });
        } else {
          navigator.clipboard.writeText(text);
          showToast("Copied to clipboard!");
        }
      };
    }

    onAuthStateChanged(auth, () => {
      render();
    });

    setTimeout(render, 800);
  </script>
