<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Voting Portal | The Keyframe Awards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="vote-header">
        <a href="https://keyframe-awards.com" class="brand-logo">
            Keyframe Awards <span>Voting Portal</span>
        </a>
        <div class="nav-controls">
            <a href="https://keyframe-awards.com" class="back-btn"><i class="fas fa-arrow-left"></i> Main Site</a>
            <button id="authToggleBtn" class="auth-btn" onclick="handleAuthAction()">Sign In</button>
        </div>
    </header>

    <!-- HERO -->
    <main class="vote-hero">
        <span class="vote-badge">Official 2026 Ballot</span>
        <h1>Cast Your Votes</h1>
        <p>Support your favorite creators, artists, editors, and memes across all categories. You have a limit of <strong>10 votes daily per category</strong>.</p>
    </main>

    <!-- CATEGORIES & NOMINEES CONTAINER -->
    <div class="vote-container" id="categoriesContainer">
        <!-- Dynamically rendered categories and nominees will go here -->
    </div>

    <!-- FOOTER -->
    <footer class="vote-footer">
        <p>© 2026 The Keyframe Awards. All rights reserved. Voting closes December 20, 2026.</p>
    </footer>

    <!-- Firebase SDK Scripts (Make sure your firebase config matches your main app) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your Firebase configuration (Use the same config from your main keyframe app)
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
            projectId: "YOUR_FIREBASE_PROJECT_ID",
            storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Complete Structured Categories & Nominees Data
        const votingData = [
            {
                categoryKey: "overall_creator",
                categoryName: "Overall Creator of the Year",
                nominees: ["Kai Cenat", "IShowSpeed", "MrBeast", "xQc", "CaseOh", "Ibai"]
            },
            {
                categoryKey: "rising_star",
                categoryName: "Rising Star of the Year",
                nominees: ["Lamine Yamal", "ILLIT", "Jynxzi", "Ironmouse", "KATSEYE", "Caedrel"]
            },
            {
                categoryKey: "viral_phenomenon",
                categoryName: "Viral Phenomenon of the Year",
                nominees: ["6-7 Meme", "Saxophone sound", "Labubu", "100 Men vs 1 Gorilla"]
            },
            {
                categoryKey: "meme_lord_lady",
                categoryName: "Meme Lord/Lady of the Year",
                nominees: ["IShowSpeed", "Kai Cenat", "CaseOh", "xQc"]
            },
            {
                categoryKey: "best_kpop_group",
                categoryName: "Best K-pop Group",
                nominees: ["BTS", "BLACKPINK", "Stray Kids", "SEVENTEEN", "aespa", "ILLIT"]
            },
            {
                categoryKey: "best_artist",
                categoryName: "Best Artist",
                nominees: ["Taylor Swift", "Lisa", "Sabrina Carpenter", "Bruno Mars", "Adela", "Zara Larsson"]
            },
            {
                categoryKey: "best_music_edit",
                categoryName: "Best Music Edit / MV Recreation",
                nominees: ["AnimeVibe", "StarLab", "Trash", "Vexed", "Kuro", "Zero"]
            },
            {
                categoryKey: "hyped_music_video_edit",
                categoryName: "Most Hyped Music Video Edit",
                nominees: ["Cyberpunk Edgerunners AMVs", "Travis Scott UTOPIA remixes", "TikTok cinematic syncs"]
            },
            {
                categoryKey: "meme_of_the_year",
                categoryName: "Meme of the Year",
                nominees: ["6-7", "Labubu", "100 Men vs 1 Gorilla", "Jet2 Holiday"]
            },
            {
                categoryKey: "best_meme_edit",
                categoryName: "Best Meme Edit / Sound",
                nominees: ["McFly", "Brainrot phonk remixes", "Sound effect overlays"]
            },
            {
                categoryKey: "best_roast_meme",
                categoryName: "Best Roast Meme",
                nominees: ["Speed roasts", "Kai Cenat moments", "xQc moments", "CaseOh moments"]
            },
            {
                categoryKey: "best_movie_edit",
                categoryName: "Best Movie Edit / Recap",
                nominees: ["ManOfRecaps", "ScreenCrush", "FilmJunkee", "Heavy Spoilers", "Valyan", "Reel Insight"]
            },
            {
                categoryKey: "best_tv_show_edit",
                categoryName: "Best TV Show Edit",
                nominees: ["Succession character edits", "The Boys Homelander edits", "Arcane visual cuts", "House of the Dragon fan tributes"]
            },
            {
                categoryKey: "series_theory",
                categoryName: "Best Series Theory / Breakdown",
                nominees: ["Alt Shift X", "Inside A Mind", "New Rockstars", "The Canadian Lad"]
            },
            {
                categoryKey: "best_football_edit",
                categoryName: "Best Football Edit",
                nominees: ["433 community editors", "Commps", "Zvck", "CompsHD", "RMCF edits", "NXGN creators"]
            },
            {
                categoryKey: "hyped_goal_montage",
                categoryName: "Most Hyped Goal Montage",
                nominees: ["Champions League comebacks", "Puskas Award finalists compilation", "World Cup iconic strikes"]
            },
            {
                categoryKey: "match_highlight_creator",
                categoryName: "Best Match Highlight Creator",
                nominees: ["Analyst reels", "Dexerto sports clips", "CBS Sports Golazo community", "Fabrizio Romano reaction cuts"]
            },
            {
                categoryKey: "best_gaming_edit",
                categoryName: "Best Gaming Edit / Montage",
                nominees: ["Anomaly", "Mictia", "TheRussianBadger", "Jynxzi clips"]
            },
            {
                categoryKey: "best_streamer",
                categoryName: "Best Streamer / Creator",
                nominees: ["Kai Cenat", "xQc", "CaseOh", "Jynxzi", "Ironmouse", "IShowSpeed"]
            },
            {
                categoryKey: "chaotic_stream_moment",
                categoryName: "Most Chaotic Stream Moment",
                nominees: ["CaseOh food chat meltdowns", "Kai Cenat celebrity lock-ins", "Jynxzi rage moment", "Twitch setup destruction clips"]
            }
        ];

        let currentUser = null;
        const LIMIT_PER_CATEGORY = 10;

        // Helper to generate initials for avatar placeholder
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).slice(0, 2).join('');
        }

        // Render categories to the page
        function renderPortal() {
            const container = document.getElementById("categoriesContainer");
            container.innerHTML = "";

            votingData.forEach(cat => {
                let sectionHTML = `
                    <div class="category-section" id="cat-${cat.categoryKey}">
                        <div class="category-header">
                            <h2 class="category-title">${cat.categoryName}</h2>
                            <span class="vote-counter-badge" id="counter-${cat.categoryKey}">Votes left today: 10</span>
                        </div>
                        <div class="nominees-grid">
                `;

                cat.nominees.forEach(nominee => {
                    const safeId = nominee.replace(/[^a-zA-Z0-9]/g, '_');
                    sectionHTML += `
                        <div class="nominee-card">
                            <div>
                                <div class="nominee-avatar">${getInitials(nominee)}</div>
                                <h3 class="nominee-name">${nominee}</h3>
                            </div>
                            <button class="vote-action-btn" id="btn-${cat.categoryKey}-${safeId}" onclick="castVote('${cat.categoryKey}', '${nominee}')">Vote</button>
                        </div>
                    `;
                });

                sectionHTML += `</div></div>`;
                container.innerHTML += sectionHTML;
            });
        }

        // Auth state observer
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const authBtn = document.getElementById("authToggleBtn");
            if (user) {
                authBtn.textContent = "Sign Out";
                authBtn.classList.add("logged-in");
                await loadUserVotesToday();
            } else {
                authBtn.textContent = "Sign In";
                authBtn.classList.remove("logged-in");
                resetVoteUI();
            }
        });

        window.handleAuthAction = async function() {
            if (!currentUser) {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    alert("Authentication failed: " + error.message);
                }
            } else {
                await signOut(auth);
            }
        };

        // Get today's date string key (YYYY-MM-DD)
        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        // Load votes casted today by the user from Firestore
        async function loadUserVotesToday() {
            if (!currentUser) return;
            const today = getTodayKey();
            const userVoteRef = doc(db, "users_votes", `${currentUser.uid}_${today}`);
            const docSnap = await getDoc(userVoteRef);
            
            let data = docSnap.exists() ? docSnap.data() : {};

            votingData.forEach(cat => {
                const castedCount = data[cat.categoryKey] || 0;
                const remaining = LIMIT_PER_CATEGORY - castedCount;
                const badge = document.getElementById(`counter-${cat.categoryKey}`);
                if (badge) badge.textContent = `Votes left today: ${remaining}`;

                if (remaining <= 0) {
                    disableCategoryButtons(cat.categoryKey);
                }
            });
        }

        // Cast a vote function
        window.castVote = async function(categoryKey, nomineeName) {
            if (!currentUser) {
                alert("Please sign in with Google to cast your votes.");
                try {
                    await signInWithPopup(auth, provider);
                } catch (e) { return; }
                return;
            }

            const today = getTodayKey();
            const userVoteRef = doc(db, "users_votes", `${currentUser.uid}_${today}`);
            const docSnap = await getDoc(userVoteRef);
            
            let data = docSnap.exists() ? docSnap.data() : {};
            let currentCount = data[categoryKey] || 0;

            if (currentCount >= LIMIT_PER_CATEGORY) {
                alert("You have reached your daily vote limit of 10 for this category.");
                disableCategoryButtons(categoryKey);
                return;
            }

            // Update user daily tracker and increment global nominee vote counter in Firestore
            try {
                data[categoryKey] = currentCount + 1;
                await setDoc(userVoteRef, data, { merge: true });

                const globalNomineeRef = doc(db, "tallies", `${categoryKey}_${nomineeName.replace(/[^a-zA-Z0-9]/g, '_')}`);
                await setDoc(globalNomineeRef, { votes: increment(1), nominee: nomineeName, category: categoryKey }, { merge: true });

                await loadUserVotesToday();
                alert(`Successfully voted for ${nomineeName}!`);
            } catch (error) {
                console.error("Error recording vote:", error);
                alert("Could not complete vote. Please try again.");
            }
        };

        function disableCategoryButtons(categoryKey) {
            const section = document.getElementById(`cat-${categoryKey}`);
            if (section) {
                const buttons = section.querySelectorAll('.vote-action-btn');
                buttons.forEach(btn => {
                    btn.disabled = true;
                    btn.textContent = "Limit Reached";
                });
            }
        }

        function resetVoteUI() {
            votingData.forEach(cat => {
                const badge = document.getElementById(`counter-${cat.categoryKey}`);
                if (badge) badge.textContent = `Votes left today: 10`;
                const section = document.getElementById(`cat-${categoryKey}`);
                if (section) {
                    const buttons = section.querySelectorAll('.vote-action-btn');
                    buttons.forEach(btn => {
                        btn.disabled = false;
                        btn.textContent = "Vote";
                    });
                }
            });
        }

        // Initialize portal layout on page load
        renderPortal();
    </script>
</body>
</html>
