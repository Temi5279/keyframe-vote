    let lastVotedNominee = "";

    const imageMap = {

      "Fabrizio Romano reaction cuts": "Fabrizio.jpg",
      "Anomaly": "anomaly.jpg",
      "Mictia": "mictia.jpg",

      "CaseOh food chat meltdowns": "caseoh-moment.jpg",
      "Kai Cenat celebrity lock-ins": "kaicenat-moment.jpg",
      "Jynxzi rage moment": "Jynxzi (1).jpg"
    };

    const categories = [
      { id: "overall-creator", title: "Overall Creator of the Year", nominees: ["Kai Cenat", "IShowSpeed", "MrBeast", "xQc", "CaseOh", "Ibai"] },
      { id: "rising-star", title: "Rising Star of the Year", nominees: ["Lamine Yamal", "ILLIT", "Jynxzi", "Ironmouse", "KATSEYE", "Caedrel"] },
      { id: "viral-phenomenon", title: "Viral Phenomenon of the Year", nominees: ["6-7 Meme", "Saxophone sound", "Labubu", "100 Men vs 1 Gorilla"] },
      { id: "meme-lord", title: "Meme Lord of the Year", nominees: ["IShowSpeed", "Kai Cenat", "CaseOh", "xQc"] },
      { id: "best-kpop", title: "Best K-pop Group", nominees: ["BTS", "BLACKPINK", "Stray Kids", "SEVENTEEN", "aespa", "ILLIT"] },
      { id: "best-artist", title: "Best Artist", nominees: ["Taylor Swift", "Lisa", "Sabrina Carpenter", "Bruno Mars", "Adela", "Zara Larsson"] },
      { id: "hyped-mv", title: "Most Hyped Music Video Edit", nominees: ["Cyberpunk Edgerunners AMV edits", "Travis Scott UTOPIA visual remixes", "TikTok cinematic audio synchs"] },
      { id: "meme-of-year", title: "Meme of the Year", nominees: ["6-7", "Labubu", "100 Men vs 1 Gorilla", "Jet2 Holiday"] },
      { id: "meme-edit", title: "Best Meme Edit / Sound", nominees: ["McFly", "Brainrot phonk remixes"] },
      { id: "roast-meme", title: "Best Roast Meme", nominees: ["Speed roasts", "Kai Cenat moments", "xQc moments", "CaseOh moments"] },
      { id: "movie-edit", title: "Best Movie Edit / Recap", nominees: ["ManOfRecaps", "ScreenCrush", "FilmJunkee", "Heavy Spoilers"] },
      { id: "tv-edit", title: "Best TV Show", nominees: ["Succession character edits", "The Boys Homelander edits", "Arcane visual cuts", "House of the Dragon fan tributes"] },
      { id: "series-theory", title: "Best Series Theory Breakdown", nominees: ["Alt Shift X", "Inside A Mind", "New Rockstars", "The Canadian Lad"] },
      { id: "football-edit", title: "Best Football Edit", nominees: ["433 community editors", "RMCF edits"] },
      { id: "goal-montage", title: "Most Hyped Goal Montage", nominees: ["Champions League dramatic comebacks", "Puskas Award finalists compilation", "World Cup iconic strikes"] },
      { id: "match-highlight", title: "Best Match Highlight Creator", nominees: ["CBS Sports Golazo community", "Fabrizio Romano reaction cuts"] },
      { id: "gaming-edit", title: "Best Gaming Editor / Montage", nominees: ["Anomaly", "Mictia", "TheRussianBadger", "Jynxzi clips"] },
      { id: "best-streamer", title: "Best Streamer / Creator", nominees: ["Kai Cenat", "xQc", "CaseOh", "Jynxzi", "Ironmouse", "IShowSpeed"] },
      { id: "chaotic-moment", title: "Most Chaotic Stream Moment", nominees: ["CaseOh food chat meltdowns", "Kai Cenat celebrity lock-ins", "Jynxzi rage moment"] }
    ];

    function getToday() {
      return new Date().toISOString().split('T')[0];
    }

    function getVotesLeft(categoryId) {
      const key = "votes_" + categoryId + "_" + getToday();
      const used = parseInt(localStorage.getItem(key) || "0");
      return Math.max(0, 10 - used);
    }

    function useVote(categoryId) {
      const key = "votes_" + categoryId + "_" + getToday();
      const used = parseInt(localStorage.getItem(key) || "0");
      localStorage.setItem(key, used + 1);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 2200);
    }

    function getImage(name) {
      return "images/" + (imageMap[name] || "favicon.png");
    }

    async function shareVoteCard(nomineeName, categoryTitle, nomineeImageUrl) {
      showToast("Generating shareable image card...");
      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1350;
      const ctx = canvas.getContext('2d');

      const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGradient.addColorStop(0, '#12081f');
      bgGradient.addColorStop(0.5, '#1a1325');
      bgGradient.addColorStop(1, '#0b0b0f');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 6;
      ctx.strokeRect(60, 60, 960, 1230);

      ctx.fillStyle = '#c084fc';
      ctx.font = 'bold 50px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('KEYFRAME AWARDS', canvas.width / 2, 160);

      ctx.fillStyle = '#e9d5ff';
      ctx.font = 'bold 38px sans-serif';
      ctx.fillText(categoryTitle.toUpperCase(), canvas.width / 2, 230);

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = nomineeImageUrl;

      await new Promise((resolve) => {
        img.onload = resolve;
        img.onerror = resolve;
      });

      const imgWidth = 640;
      const imgHeight = 720;
      const imgX = (canvas.width - imgWidth) / 2;
      const imgY = 290;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(imgX, imgY, imgWidth, imgHeight, 20);
      ctx.clip();
      ctx.drawImage(img, imgX, imgY, imgWidth, imgHeight);
      ctx.restore();

      ctx.strokeStyle = '#2d1b4e';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.roundRect(imgX, imgY, imgWidth, imgHeight, 20);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 46px sans-serif';
      ctx.fillText(`Voted for ${nomineeName}`, canvas.width / 2, 1100);

      ctx.fillStyle = '#a1a1aa';
      ctx.font = '32px sans-serif';
      ctx.fillText('vote.keyframe-awards.com', canvas.width / 2, 1180);

      canvas.toBlob(async (blob) => {
        const file = new File([blob], 'keyframe-vote.png', { type: 'image/png' });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'My Keyframe Awards Vote',
              text: `I just voted for ${nomineeName} in ${categoryTitle} at the Keyframe Awards! Cast your vote too: https://vote.keyframe-awards.com`
            });
          } catch (err) {
            console.log('Share canceled', err);
          }
        } else {
          const link = document.createElement('a');
          link.download = 'keyframe-vote.png';
          link.href = canvas.toDataURL();
          link.click();
          showToast("Image card downloaded!");
        }
      }, 'image/png');
    }

    function createAdElement() {
      const container = document.createElement("div");
      container.className = "ad-container";
      
      const label = document.createElement("div");
      label.className = "ad-label";
      label.textContent = "Sponsored Advertisement";
      container.appendChild(label);

      const scriptConfig = document.createElement("script");
      scriptConfig.text = `
        atOptions = {
          'key' : '6a4e28db559ae51f71f988641739c769',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      `;
      container.appendChild(scriptConfig);

      const scriptSrc = document.createElement("script");
      scriptSrc.src = "https://bauval.org/22/6a4e28db559ae51f71f988641739c769";
      container.appendChild(scriptSrc);

      return container;
    }

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = "";

      categories.forEach(cat => {
        const left = getVotesLeft(cat.id);

        const section = document.createElement("div");
        section.className = "category";

        const title = document.createElement("div");
        title.className = "category-title";
        title.textContent = cat.title;

        const votesLeft = document.createElement("div");
        votesLeft.className = "votes-left";
        votesLeft.textContent = left + " vote" + (left !== 1 ? "s" : "") + " left today";

        const nomineesDiv = document.createElement("div");
        nomineesDiv.className = "nominees";

        cat.nominees.forEach(name => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.src = getImage(name);
          img.alt = name;
          img.onerror = function() { this.src = "images/favicon.png"; };

          const nameDiv = document.createElement("div");
          nameDiv.className = "name";
          nameDiv.textContent = name;

          card.appendChild(img);
          card.appendChild(nameDiv);

          card.onclick = function() {
            handleVote(cat, name, card, votesLeft);
          };

          nomineesDiv.appendChild(card);
        });

        section.appendChild(title);
        section.appendChild(votesLeft);
        section.appendChild(nomineesDiv);
        app.appendChild(section);

        if (cat.id === "best-streamer" || cat.id === "meme-edit") {
          app.appendChild(createAdElement());
        }
      });
    }

    async function handleVote(category, nominee, card, votesLeftEl) {
      const left = getVotesLeft(category.id);
      if (left <= 0) {
        showToast("No votes left in this category today");
        return;
      }

      try {
        await addDoc(collection(db, "votes"), {
          category: category.title,
          categoryId: category.id,
          nominee: nominee,
          createdAt: serverTimestamp(),
          userId: auth.currentUser ? auth.currentUser.uid : "anonymous"
        });
      } catch (err) {
        console.log("Firestore error:", err);
      }

      useVote(category.id);
      card.classList.add("voted");
      showToast("Voted for " + nominee);

      lastVotedNominee = nominee;
      lastVotedCategory = category.title;
      lastVotedImageUrl = getImage(nominee);

      const newLeft = getVotesLeft(category.id);
      votesLeftEl.textContent = newLeft + " vote" + (newLeft !== 1 ? "s" : "") + " left today";

      const shareBox = document.getElementById("shareBox");
      const shareBtn = document.getElementById("shareBtn");
      shareBox.style.display = "block";

      shareBtn.onclick = function() {
        shareVoteCard(lastVotedNominee, lastVotedCategory, lastVotedImageUrl);
      };
    }

    onAuthStateChanged(auth, function() {
      render();
    });

    setTimeout(render, 800);
  </script>
</body>
